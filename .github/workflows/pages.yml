name: Deploy Dashboard
on:
  push:
    branches: [main]
    paths: ['docs/**', 'data/progress.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ["Scrape PRO Tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore scraper cache
        uses: actions/cache@v4
        with:
          path: |
            data/progress.json
            data/tests/
          key: scrape-pro-v2
          restore-keys: scrape-pro-v2
      - name: Copy progress.json to docs
        run: |
          if [ -f data/progress.json ]; then
            cp data/progress.json docs/progress.json
            echo "✓ Copied progress.json ($(python3 -c "import json;d=json.load(open('data/progress.json'));print(len(d.get('scraped_test_ids',[])))") scraped)"
          else
            echo '{"scraped_test_ids":[],"partial_test_ids":[],"failed_test_ids":[],"test_inventory":[],"run_history":[]}' > docs/progress.json
            echo "⚠ No progress.json found — created empty stub"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
